name: Seerr

services:

  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: seerr-pg
    volumes:
      - seerr-postgres_data:/var/lib/postgresql:rw
    environment:
      - POSTGRES_DB
      - POSTGRES_PASSWORD
      - POSTGRES_USER
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    labels:
      - wud.tag.include=^\d+\.\d+-alpine$$
      - traefik.enable=false
  seerr:
    image: seerr/seerr:v${SEERR_VERSION}
    container_name: seerr
    volumes:
      - ./config:/app/config:rw
    environment:
      - DB_TYPE
      - DB_HOST
      - DB_USER
      - DB_PASS
      - DB_NAME
    ports:
      - '127.0.0.1:5055:5055'
    networks:
      - backend
      - db
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - wud.tag.include=^v\d+\.\d+\.\d+$$
      - traefik.enable=true
    init: true

networks:
  backend:
    driver: bridge
    external: true
  db:
    driver: bridge
    external: false

volumes:
  seerr-postgres_data:
